[workspace]
resolver = "2"
members = ["uwbl-core", "uwbld", "uwbl", "uwbl-tray"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/michaelkamau/backlight-driver"
authors = ["Michael Kamau"]

[workspace.dependencies]
uwbl-core = { path = "uwbl-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
ksni = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
