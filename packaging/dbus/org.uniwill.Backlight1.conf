<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (uwbld) may own the name; anyone may talk to it. Mutating calls are
       additionally gated by polkit inside the daemon. -->
  <policy user="root">
    <allow own="org.uniwill.Backlight1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.uniwill.Backlight1"/>
    <allow receive_sender="org.uniwill.Backlight1"/>
  </policy>
</busconfig>
